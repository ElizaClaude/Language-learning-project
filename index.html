<style>
/* Layout: one narrow column of lessons, a player docked at the bottom like a phone audio app. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #1d2320;
  --muted: #5f6964;
  --line: #dcdfda;
  --accent: #a4561b;          /* set per language below */
  --accent-soft: #f4e6da;
  --on-accent: #ffffff;
  --done: #2f7d4f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-han: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
:root[data-lang="zh"] { --accent: #b3261e; --accent-soft: #f7e1de; }
:root[data-lang="es"] { --accent: #8b3a7e; --accent-soft: #f3e2ef; }
:root[data-lang="it"] { --accent: #2f6b4f; --accent-soft: #e0eee6; }
:root[data-lang="en"] { --accent: #2b5a9e; --accent-soft: #dfe8f5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1d2220; --ink: #e8ebe7; --muted: #9aa49f; --line: #2e3532;
    --accent: #e09a5f; --accent-soft: #3a2a1d; --on-accent: #1a120b; --done: #6cc28f;
    color-scheme: dark;
  }
  :root[data-lang="zh"]:not([data-theme="light"]) { --accent: #f08a7e; --accent-soft: #3d2120; }
  :root[data-lang="es"]:not([data-theme="light"]) { --accent: #dc9ad0; --accent-soft: #38202f; }
  :root[data-lang="it"]:not([data-theme="light"]) { --accent: #84c9a5; --accent-soft: #1c3127; }
  :root[data-lang="en"]:not([data-theme="light"]) { --accent: #8fb4ea; --accent-soft: #1d2a3d; }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1d2220; --ink: #e8ebe7; --muted: #9aa49f; --line: #2e3532;
  --accent: #e09a5f; --accent-soft: #3a2a1d; --on-accent: #1a120b; --done: #6cc28f;
  color-scheme: dark;
}
:root[data-theme="dark"][data-lang="zh"] { --accent: #f08a7e; --accent-soft: #3d2120; }
:root[data-theme="dark"][data-lang="es"] { --accent: #dc9ad0; --accent-soft: #38202f; }
:root[data-theme="dark"][data-lang="it"] { --accent: #84c9a5; --accent-soft: #1c3127; }
:root[data-theme="dark"][data-lang="en"] { --accent: #8fb4ea; --accent-soft: #1d2a3d; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 13rem;
}
.wrap { max-width: 34rem; margin: 0 auto; display: grid; gap: 1.25rem; }
header { display: grid; gap: .75rem; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 1.9rem;
  line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; font-size: .95rem; }

.switch { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.switch button {
  font: inherit; font-weight: 700; font-size: .92rem; border: 0; border-radius: 999px; padding: .6rem .25rem;
  background: transparent; color: var(--muted); cursor: pointer;
}
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.switch .han { font-family: var(--font-han); }
.switch button[data-ready="false"]:not([aria-pressed="true"]) { opacity: .45; }
.switch button:disabled { opacity: .2; cursor: default; }
.pick { display: grid; gap: .3rem; }
.switch[hidden] { display: none; }
.script .kind { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: var(--accent); margin-right: .4rem; }
.script li.k1 { margin-left: 1rem; }
.pick-label { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-left: .25rem; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 1rem; margin: 0; color: var(--muted); }
.han { font-family: var(--font-han); }

h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
h2 small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: .85rem; }

ol.lessons { list-style: none; margin: 0; padding: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
ol.lessons li + li { border-top: 1px solid var(--line); }
.lesson {
  width: 100%; display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: .75rem;
  padding: .8rem 1rem; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.lesson:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.lesson .t { min-width: 0; }
.lesson .t b { display: block; font-weight: 700; }
.lesson .t span { color: var(--muted); font-size: .85rem; }
.state { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.state.done { color: var(--done); font-weight: 700; }
.lesson[aria-current="true"] { background: var(--accent-soft); }
.lesson[aria-current="true"] .num { color: var(--accent); }

.how { color: var(--muted); font-size: .85rem; margin: 0; }

/* bottom player */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: .75rem 16px calc(.75rem + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgb(0 0 0 / .08);
}
.player-in { max-width: 34rem; margin: 0 auto; display: grid; gap: .5rem; }
.now { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; min-width: 0; }
.now b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now span { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.controls { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; }
.controls button {
  font: inherit; font-size: .85rem; font-weight: 700; color: var(--ink); background: none; border: 0;
  min-width: 2.75rem; min-height: 2.75rem; border-radius: 999px; cursor: pointer;
}
.controls button:disabled { opacity: .35; cursor: default; }
.controls .play { background: var(--accent); color: var(--on-accent); width: 3.4rem; height: 3.4rem; }
.controls svg { width: 1.4rem; height: 1.4rem; fill: currentColor; display: block; margin: auto; }
.extras { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.chip { font: inherit; font-size: .8rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 999px; padding: .3rem .7rem; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

.script { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .5rem 1rem; }
.script ol { margin: 0; padding-left: 1.4rem; display: grid; gap: .55rem; }
.script li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.script .fo { display: block; font-weight: 700; }
.script .fo.han { font-family: var(--font-han); font-size: 1.1rem; }
.script .en { color: var(--muted); font-size: .9rem; }
.script .en.han { font-family: var(--font-han); }
@media (prefers-reduced-motion: no-preference) { .lesson { transition: background .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Two-Voice Lessons</h1>
    <p class="sub" id="sub">Each sentence is said in the language you're learning, then in English, twice.</p>
    <div class="pick"><span class="pick-label" id="learn-label">I want to learn</span>
      <div class="switch" id="learn" role="group" aria-labelledby="learn-label"></div></div>
    <div class="pick"><span class="pick-label" id="from-label">I speak</span>
      <div class="switch" id="from" role="group" aria-labelledby="from-label"></div></div>
    <div class="switch" id="format" role="group" aria-label="Lesson format" hidden>
      <button type="button" data-format="steps">Step by step · 3 min</button>
      <button type="button" data-format="classic">Classic</button></div>
  </header>
  <main id="levels"></main>
  <section class="script" id="script" hidden aria-label="Sentences of the current lesson"></section>
  <p class="how">Your place in each lesson is remembered on this phone. Tap a lesson to start or resume it.</p>
</div>

<div class="player" aria-label="Player">
  <div class="player-in">
    <div class="now"><b id="now-title">Choose a lesson</b><span id="now-time">0:00 / 0:00</span></div>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Position in lesson">
    <div class="controls">
      <button type="button" id="prev" aria-label="Previous lesson"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" id="back" aria-label="Back 10 seconds">−10s</button>
      <button type="button" id="play" class="play" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
      <button type="button" id="fwd" aria-label="Forward 10 seconds">+10s</button>
      <button type="button" id="next" aria-label="Next lesson"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="extras">
      <button type="button" class="chip" id="speed" aria-label="Playback speed">Speed 1×</button>
      <button type="button" class="chip" id="auto" aria-pressed="true">Auto-next</button>
      <button type="button" class="chip" id="text" aria-pressed="false">Show text</button>
    </div>
  </div>
</div>

    return {
      // for "from English" the key is the old MP3 path, so progress from before 17 Oct stays
      key: b === "en" ? `audio/${t}/${x.id}.mp3` : `${t}-${b}/${x.id}`, level: x.level, num: String(x.n).padStart(2, "0"),
      title: B.title || x.title, sub: `${x.lines.length} ${x.level === 0 ? "words and phrases" : "sentences"}`,
      dur: B.dur, durSlow: B.durSlow,
      text: x.lines.map((l, j) => [0, l[0], B.lines[j][0]]),
      seq: slow => x.lines.flatMap((l, j) => Array.from({ length: REPEATS }, (_, r) =>
        [voiceKey(l, r, slow), "pause2", B.lines[j][1], "pause3"]).flat()),
    };
  });
}
const cur = () => current && lessonsOf(current.t, current.b, current.f)[current.i];
const fracOf = x => { const p = pos[x.key] || 0; return p > 1 ? p / x.dur : p; };
const durOf = x => speed === 0.5 ? x.durSlow : x.dur;
const savePos = () => {
  const x = cur();
  if (!x || !playable || !(audio.duration > 0) || !(audio.currentTime > 0)) return;
  pos[x.key] = audio.currentTime / audio.duration; store.set("pos", pos);
};

// ---- joining a lesson from its clips ----
const clip = k => fetch(`clips/${k}.mp3`).then(r => { if (!r.ok) throw new Error(k); return r.arrayBuffer(); });
const blobs = new Map();               // "key|slow" -> Promise<Blob>, the last few lessons only
function lessonBlob(x, slow) {
  const id = x.key + "|" + slow;
  if (!blobs.has(id)) {
    const seq = x.seq(slow);
    const names = [...new Set(seq)];
    const p = Promise.all(names.map(clip)).then(bufs => {
      const byName = new Map(names.map((n, j) => [n, bufs[j]]));
      return new Blob(seq.map(n => byName.get(n)), { type: "audio/mpeg" });
    });
    p.catch(() => blobs.delete(id));
    blobs.set(id, p);
    while (blobs.size > 4) blobs.delete(blobs.keys().next().value);
  }
  return blobs.get(id);
}
let blobUrl = null;
function setSource(blob) {
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  audio.src = blobUrl;
}

function render() {
  document.documentElement.dataset.lang = target;
  for (const b of $("learn").children) b.setAttribute("aria-pressed", b.dataset.lang === target);
  for (const b of $("from").children) {
    b.setAttribute("aria-pressed", b.dataset.lang === base);
    b.disabled = b.dataset.lang === target;
    b.dataset.ready = ready(target, b.dataset.lang);
  }
  const f = formatOf(target, base);
  $("format").hidden = !(hasSteps(target, base) && hasClassic(target, base));
  for (const b of $("format").children) b.setAttribute("aria-pressed", b.dataset.format === f);
  $("sub").textContent = f === "steps"
    ? `Parts of at most 3 minutes. Each new ${label(target)} sentence is said whole, then word by word, then whole again, with ${label(base)} after each piece. Quizzes bring back earlier sentences.`
    : `Each sentence is said in ${label(target)}, then in ${label(base)}, and the pair is played twice.`;
  const main = $("levels");
  main.innerHTML = "";
  if (f === "steps" && !(stepData[target + "|" + base] && !(stepData[target + "|" + base] instanceof Promise))) {
    main.innerHTML = `<p class="empty">Loading the lessons…</p>`;
    loadSteps(target, base);
    return;
  }
  const list = lessonsOf(target, base, f);
  if (!list.length) {
    const from = Object.keys(DATA.langs).filter(b => ready(target, b)).map(label);
    main.innerHTML = `<p class="empty">Learning ${label(target)} from ${label(base)} is not ready yet.` +
      (from.length ? ` Ready now: ${label(target)} from ${from.join(" or ")}.` : "") + `</p>`;
  }
  const hanBase = base === "zh" ? "han" : "";
  for (const level of [...new Set(list.map(x => x.level))]) {
    const lv = list.filter(x => x.level === level);
    const sec = document.createElement("section");
    sec.style.display = "grid"; sec.style.gap = ".6rem";
    const total = lv.reduce((a, x) => a + durOf(x), 0);
    const nDone = lv.filter(x => done[x.key]).length;
    sec.innerHTML = `<h2>Level ${level}${level === 0 ? " · first words" : ""} <small>${lv.length} ${f === "steps" ? "parts" : "lessons"} · ${Math.round(total / 60)} min · ${nDone} done</small></h2>`;
    const ol = document.createElement("ol"); ol.className = "lessons";
    for (const x of lv) {
      const idx = list.indexOf(x);
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.className = "lesson";
      b.setAttribute("aria-current", !!current && current.t === target && current.b === base && current.f === f && current.i === idx);
      const p = fracOf(x) * durOf(x);
      const state = done[x.key] ? `<span class="state done">✓ done</span>`
        : p > 5 ? `<span class="state">resume ${fmt(p)}</span>` : `<span class="state">${fmt(durOf(x))}</span>`;
      b.innerHTML = `<span class="num">${x.num}</span>
        <span class="t"><b class="${hanBase}">${x.title}</b><span>${x.sub}</span></span>${state}`;
      b.addEventListener("click", () => load(target, base, f, idx, true));
      li.append(b); ol.append(li);
    }
    sec.append(ol); main.append(sec);
  }
  renderScript();
}

function renderScript() {
  const box = $("script");
  const x = cur();
  box.hidden = !(showText && x);
  if (box.hidden) return;
  const hanT = current.t === "zh" ? " han" : "", hanB = current.b === "zh" ? " han" : "";
  const mark = kind => kind === 2 ? `<span class="kind">quiz</span>` : kind === 1 ? `<span class="kind">piece</span>` : "";
  box.innerHTML = "<ol>" + x.text.filter((s, j, a) => !(s[0] === 0 && a.findIndex(z => z[0] === 0 && z[1] === s[1]) < j))
    .map(([kind, fo, mine]) => `<li class="k${kind}">${mark(kind)}<span class="fo${hanT}">${fo}</span><span class="en${hanB}">${mine}</span></li>`)
    .join("") + "</ol>";
}

async function load(t, b, f, i, play) {
  const list = lessonsOf(t, b, f);
  if (i < 0 || i >= list.length) return;
  const x = list[i];
  const same = current && current.t === t && current.b === b && current.f === f && current.i === i;
  if (!same) {
    const my = ++token;
    current = { t, b, f, i };
    playable = false;
    // Phones only allow sound that starts from a tap. Start a short silence right away, inside
    // the tap, and swap in the joined lesson when it is ready (the player stays allowed to play).
    if (play) { audio.src = "clips/pause2.mp3"; audio.play().catch(() => {}); }
    $("now-title").textContent = `Loading ${x.num}. ${x.title}…`;
    updateButtons(); render();
    let blob;
    try { blob = await lessonBlob(x, speed === 0.5); }
    catch { if (my === token) { $("now-title").textContent = "Could not load the lesson. Check the internet and tap it again."; current = null; } return; }
    if (my !== token) return;
    const start = done[x.key] ? 0 : fracOf(x);
    setSource(blob);
    audio.playbackRate = rateOf();
    audio.addEventListener("loadedmetadata", () => {
      audio.currentTime = Math.min(start * audio.duration, Math.max(0, audio.duration - 1));
      audio.playbackRate = rateOf();
      playable = true;
    }, { once: true });
    $("now-title").textContent = `${DATA.langs[t].short} · ${x.num}. ${x.title}`;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: `${x.num}. ${x.title}`,
        artist: `Two-Voice Lessons · ${label(t)} from ${label(b)}`, album: `Level ${x.level}` });
    }
    if (done[x.key]) { delete done[x.key]; store.set("done", done); }
    if (play) audio.play().catch(() => {});
    if (list[i + 1]) lessonBlob(list[i + 1], speed === 0.5).catch(() => {});   // get the next one ready
    updateButtons(); render();
    return;
  }
  if (play) audio.play().catch(() => {});
  updateButtons(); render();
}
const rateOf = () => speed === 0.5 ? 1 : speed;

function updateButtons() {
  const n = current ? lessonsOf(current.t, current.b, current.f).length : 0;
  $("prev").disabled = !current || current.i === 0;
  $("next").disabled = !current || current.i >= n - 1;
  for (const id of ["back", "fwd", "seek"]) $(id).disabled = !current;
  $("play").disabled = false;
  $("speed").textContent = speed === 0.5 ? "Slow 0.5×" : `Speed ${speed}×`;
  $("speed").title = speed === 0.5 ? "The language you learn at half speed, yours at normal speed" : "Playback speed";
  $("auto").setAttribute("aria-pressed", auto);
  $("text").setAttribute("aria-pressed", showText);
}

function setPlayIcon() {
  const playing = !audio.paused;
  $("play-icon").innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
}

$("play").addEventListener("click", () => {
  if (!current) {
    const f = formatOf(target, base), list = lessonsOf(target, base, f);
    if (!list.length) return;
    const first = list.findIndex(x => !done[x.key]);
    return load(target, base, f, first < 0 ? 0 : first, true);
  }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
});
$("back").addEventListener("click", () => { if (playable) audio.currentTime = Math.max(0, audio.currentTime - 10); });
$("fwd").addEventListener("click", () => { if (playable) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
$("prev").addEventListener("click", () => current && load(current.t, current.b, current.f, current.i - 1, true));
$("next").addEventListener("click", () => current && load(current.t, current.b, current.f, current.i + 1, true));
$("seek").addEventListener("input", e => { if (playable && audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; });
$("speed").addEventListener("click", async () => {
  const wasSlow = speed === 0.5;
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; store.set("speed", speed);
  audio.playbackRate = rateOf(); updateButtons(); render();
  const x = cur();
  if (!x || !playable || wasSlow === (speed === 0.5)) return;
  // switch between the normal and the slow joining of the same lesson, at the same place
  const my = token;
  const blob = await lessonBlob(x, speed === 0.5).catch(() => null);
  if (!blob || my !== token) return;
  const frac = audio.duration ? audio.currentTime / audio.duration : 0, playing = !audio.paused;
  playable = false;
  setSource(blob);
  audio.addEventListener("loadedmetadata", () => {
    audio.currentTime = frac * audio.duration; audio.playbackRate = rateOf(); playable = true;
    if (playing) audio.play().catch(() => {});
  }, { once: true });
});
$("auto").addEventListener("click", () => { auto = !auto; store.set("auto", auto); updateButtons(); });
$("text").addEventListener("click", () => { showText = !showText; updateButtons(); renderScript(); });
for (const b of $("format").children) {
  b.addEventListener("click", () => { format = b.dataset.format; store.set("format", format); render(); });
}

function langButton(code, onClick) {
  const L = DATA.langs[code];
  const b = document.createElement("button");
  b.type = "button"; b.dataset.lang = code;
  b.setAttribute("aria-label", L.label);
  b.innerHTML = code === "zh" ? `<span class="han">${L.native}</span>` : L.native;
  b.addEventListener("click", onClick);
  return b;
}
for (const code of Object.keys(DATA.langs)) {
  $("learn").append(langButton(code, () => {
    target = code; store.set("lang", target);
    if (base === target) {   // you can't learn a language from itself: pick a ready one, English first
      base = ["en", ...Object.keys(DATA.langs)].find(b => b !== target && ready(target, b)) || (target === "en" ? "zh" : "en");
      store.set("base", base);
    }
    render();
  }));
  $("from").append(langButton(code, () => { base = code; store.set("base", base); render(); }));
}

let lastSave = 0;
audio.addEventListener("timeupdate", () => {
  if (!playable) return;
  const d = audio.duration || 0;
  $("now-time").textContent = `${fmt(audio.currentTime)} / ${fmt(d)}`;
  if (d) $("seek").value = audio.currentTime / d * 100;
  if (current && Date.now() - lastSave > 3000) {
    lastSave = Date.now();
    savePos();
  }
});
audio.addEventListener("play", setPlayIcon);
audio.addEventListener("pause", () => {
  setPlayIcon();
  if (current && playable) { savePos(); render(); }
});
audio.addEventListener("ended", () => {
  if (!playable) return;                 // the short silence while a lesson loads
  const list = lessonsOf(current.t, current.b, current.f), x = list[current.i];
  done[x.key] = true; delete pos[x.key]; store.set("done", done); store.set("pos", pos);
  if (auto && current.i < list.length - 1) load(current.t, current.b, current.f, current.i + 1, true); else render();
});
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", () => audio.play());
    ms.setActionHandler("pause", () => audio.pause());
    ms.setActionHandler("seekbackward", () => $("back").click());
    ms.setActionHandler("seekforward", () => $("fwd").click());
    ms.setActionHandler("previoustrack", () => $("prev").click());
    ms.setActionHandler("nexttrack", () => $("next").click());
  } catch {}
}

if (base === target) base = target === "en" ? "zh" : "en";
render(); updateButtons();
</script>
